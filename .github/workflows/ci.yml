name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        working-directory: backend
        run: mvn -B verify

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get
      - name: flutter analyze
        working-directory: mobile
        run: flutter analyze
      - name: flutter test
        working-directory: mobile
        run: flutter test

  # Fails if any raw Colors.* literal creeps back into mobile/lib outside lib/theme/ (where the
  # hand-authored ColorSchemes/AppSemanticColors live). Originally its own workflow during the
  # Phase 7 color sweep; folded in here for Phase 10 as planned.
  color-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for raw Colors.* usage outside lib/theme/
        working-directory: mobile
        run: |
          # Plain ERE (no \b/-P) so this doesn't depend on the runner's locale supporting PCRE.
          # AppSemanticColors./AppColorSchemes. are the only legitimate "...Colors." identifiers
          # in this codebase and are explicitly excluded rather than relied on word-boundary matching.
          matches=$(grep -rn 'Colors\.[A-Za-z]' --include='*.dart' lib/ \
            | grep -v '^lib/theme/' \
            | grep -vE 'AppSemanticColors\.|AppColorSchemes\.' \
            || true)
          if [ -n "$matches" ]; then
            echo "Raw Colors.* usage found outside lib/theme/ -- use a ColorScheme/AppSemanticColors role instead:"
            echo "$matches"
            exit 1
          fi
          echo "No raw Colors.* usage outside lib/theme/."

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
